<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="viridianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008F7A"/>
      <stop offset="100%" style="stop-color:#00FFD4"/>
    </linearGradient>
  </defs>

  <!-- Background hexagon -->
  <polygon
    points="16,2 28,9 28,23 16,30 4,23 4,9"
    fill="#010B0A"
    stroke="#CD7F32"
    stroke-width="1"
  />

  <!-- Inner glow hexagon -->
  <polygon
    points="16,5 25,10.5 25,21.5 16,27 7,21.5 7,10.5"
    fill="none"
    stroke="url(#viridianGrad)"
    stroke-width="1.5"
    filter="url(#glow)"
  />

  <!-- Wrench icon -->
  <path
    d="M19.5 12.5L17 15L17.5 17.5L20 17L22.5 14.5C23.2 15.5 23 17 21.5 18.5C20 20 18 20.3 16.5 19.5L13 23C12.3 23.7 11.3 23.7 10.6 23C9.9 22.3 9.9 21.3 10.6 20.6L14.1 17.1C13.3 15.6 13.6 13.6 15.1 12.1C16.6 10.6 18.6 10.3 20.1 11.1L19.5 12.5Z"
    fill="url(#viridianGrad)"
    filter="url(#glow)"
  />
</svg>
